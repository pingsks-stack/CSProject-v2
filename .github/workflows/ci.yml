name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # ให้ postinstall ของ mongodb-memory-server (ตอน npm ci) และชุดทดสอบใช้ไฟล์ mongod ที่เดียวกัน จึงแคชได้
      - name: Set MongoDB binary download dir
        run: echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - run: npm ci
      - run: npm run typecheck
      - name: Typecheck tests
        run: npx tsc -p server/test --noEmit
      - run: npm run build
      - run: npm test

  # deploy เดโมขึ้น Cloudflare Containers หลังเทสต์ผ่าน (เฉพาะ push เข้า main)
  # ต้องตั้ง secrets: CLOUDFLARE_API_TOKEN และ CLOUDFLARE_ACCOUNT_ID (ดู docs/DEMO.md) ถ้ายังไม่ตั้งจะข้ามไป
  deploy-demo:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ยังไม่ได้ตั้ง CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID จึงข้ามการ deploy เดโม"
          fi

      # ตรวจ token/Account ID ก่อน build (ไม่แสดงค่าลับหรือชื่อบัญชีใน log เพราะ repo เป็น public)
      - name: Verify Cloudflare token
        if: steps.cf.outputs.ready == 'true'
        run: |
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          status=$(api /user/tokens/verify | jq -r '.result.status // "invalid"')
          echo "token status: $status"
          if [ "$status" != "active" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN ใช้ไม่ได้ (สถานะ: $status) — สร้าง token ใหม่จากแม่แบบ Edit Cloudflare Workers แล้วอัปเดต secret"
            exit 1
          fi
          if ! api "/accounts/$CLOUDFLARE_ACCOUNT_ID" | jq -e '.success' > /dev/null; then
            echo "token เข้าถึงได้ $(api '/accounts?per_page=50' | jq '.result | length') บัญชี"
            echo "::error::token เข้าถึง CLOUDFLARE_ACCOUNT_ID ไม่ได้ — ตรวจว่าใส่ Account ID (ไม่ใช่ Zone ID) และตอนสร้าง token เลือกบัญชีนี้ใน Account Resources"
            exit 1
          fi
          echo "token เข้าถึง Account ID ที่ตั้งไว้ได้"

      - uses: actions/checkout@v5
        if: steps.cf.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.cf.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install wrangler
        if: steps.cf.outputs.ready == 'true'
        working-directory: deploy/cloudflare
        run: npm ci

      - name: Deploy to Cloudflare (builds ../../Dockerfile)
        if: steps.cf.outputs.ready == 'true'
        working-directory: deploy/cloudflare
        run: npx wrangler deploy
