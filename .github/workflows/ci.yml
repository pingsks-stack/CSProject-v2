name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # ให้ postinstall ของ mongodb-memory-server (ตอน npm ci) และชุดทดสอบใช้ไฟล์ mongod ที่เดียวกัน จึงแคชได้
      - name: Set MongoDB binary download dir
        run: echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - run: npm ci
      - run: npm run typecheck
      - name: Typecheck tests
        run: npx tsc -p server/test --noEmit
      - run: npm run build
      - run: npm test

  # ทดสอบ image เดโม (Dockerfile) ด้วยทรัพยากรเท่าเครื่องฟรีของ Render: RAM 512 MB, CPU 0.1
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Build demo image
        run: docker build -t csproject-demo .

      - name: Start container (512 MB RAM, 0.1 CPU)
        run: >-
          docker run -d --name demo --memory=512m --memory-swap=512m --cpus=0.1 -p 8080:8080
          -e TRUST_PROXY=true -e REMINDERS=off -e COOKIE_SECURE=false csproject-demo

      - name: Smoke test
        run: |
          start=$(date +%s)
          until curl -sf -m 10 http://localhost:8080/api/public/config > /dev/null; do
            if [ $(( $(date +%s) - start )) -gt 240 ]; then echo "::error::container ไม่พร้อมใช้งานภายใน 4 นาที"; exit 1; fi
            sleep 3
          done
          echo "พร้อมใช้งานใน $(( $(date +%s) - start )) วินาที"
          curl -sf http://localhost:8080/ | grep -q 'id="root"'
          curl -sf -c cookies.txt -H 'Content-Type: application/json'             -d '{"username":"demo_student","password":"Demo@1234"}' http://localhost:8080/api/auth/login > /dev/null
          curl -sf -b cookies.txt http://localhost:8080/api/auth/me | jq -e '.user.username == "demo_student"'
          curl -sf http://localhost:8080/api/public/projects | jq -e '.projects | length > 0' > /dev/null
          docker stats --no-stream --format 'หน่วยความจำ: {{.MemUsage}}' demo

      - name: Container logs
        if: always()
        run: |
          docker logs demo 2>&1 | tail -40
          echo "OOMKilled: $(docker inspect demo --format '{{.State.OOMKilled}}')"

  # deploy เดโมขึ้น Cloudflare Containers หลังเทสต์ผ่าน (เฉพาะ push เข้า main) — ทางเลือกแบบเสียเงิน
  # ต้องตั้ง secrets: CLOUDFLARE_API_TOKEN และ CLOUDFLARE_ACCOUNT_ID (ดู docs/DEMO.md)
  # ถ้ายังไม่ตั้ง หรือบัญชียังไม่มีแผน Workers Paid จะข้ามไป (CI ยังผ่าน)
  deploy-demo:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ยังไม่ได้ตั้ง CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID จึงข้ามการ deploy เดโม"
          fi

      # ตรวจ token/Account ID ก่อน build (ไม่แสดงค่าลับหรือชื่อบัญชีใน log เพราะ repo เป็น public)
      - name: Verify Cloudflare token
        id: verify
        if: steps.cf.outputs.ready == 'true'
        run: |
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          # token ส่วนตัว (My Profile) ตรวจที่ /user/tokens/verify, token ของบัญชี (Manage Account) ตรวจที่ /accounts/<id>/tokens/verify
          user=$(api /user/tokens/verify)
          acct=$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          status=$(echo "$user" | jq -r '.result.status // empty')
          [ -z "$status" ] && status=$(echo "$acct" | jq -r '.result.status // empty')
          echo "token status: ${status:-invalid}"
          if [ "$status" != "active" ]; then
            echo "user verify: $(echo "$user" | jq -c '[.errors[]?.message]')"
            echo "account verify: $(echo "$acct" | jq -c '[.errors[]?.message]')"
            echo "token length: ${#CLOUDFLARE_API_TOKEN}"
            echo "::error::CLOUDFLARE_API_TOKEN ใช้ไม่ได้ — สร้าง token ใหม่จากแม่แบบ Edit Cloudflare Workers แล้ววางเฉพาะค่า token (บรรทัดเดียว) ใน secret"
            exit 1
          fi
          if ! api "/accounts/$CLOUDFLARE_ACCOUNT_ID" | jq -e '.success' > /dev/null; then
            echo "token เข้าถึงได้ $(api '/accounts?per_page=50' | jq '.result | length') บัญชี"
            echo "::error::token เข้าถึง CLOUDFLARE_ACCOUNT_ID ไม่ได้ — ตรวจว่าใส่ Account ID (ไม่ใช่ Zone ID) และตอนสร้าง token เลือกบัญชีนี้ใน Account Resources"
            exit 1
          fi
          echo "token เข้าถึง Account ID ที่ตั้งไว้ได้"
          # สิทธิ์ที่ wrangler deploy ใช้ (แสดงแค่ผ่าน/ไม่ผ่านและรหัส error)
          check() { echo "$1: $(api "/accounts/$CLOUDFLARE_ACCOUNT_ID$2" | jq -c '{success, errors: [.errors[]? | {code, message}]}')"; }
          check "Workers Scripts" /workers/scripts
          check "workers.dev subdomain" /workers/subdomain
          check "Durable Objects" /workers/durable_objects/namespaces
          check "Containers" /containers/applications
          if ! api "/accounts/$CLOUDFLARE_ACCOUNT_ID/containers/applications" | jq -e '.success' > /dev/null; then
            echo "::warning::บัญชี Cloudflare ยังไม่มีแผน Workers Paid (Containers ต้องใช้) จึงข้ามการ deploy ไป Cloudflare — เดโมฟรีใช้ Render แทน ดู docs/DEMO.md"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.verify.outputs.ok == 'true'

      - uses: actions/setup-node@v5
        if: steps.verify.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Install wrangler
        if: steps.verify.outputs.ok == 'true'
        working-directory: deploy/cloudflare
        run: npm ci

      - name: Deploy to Cloudflare (builds ../../Dockerfile)
        if: steps.verify.outputs.ok == 'true'
        working-directory: deploy/cloudflare
        run: npx wrangler deploy

      # deploy พัง: แสดงรหัส/ข้อความ error จาก API ของ Cloudflare (ใน log ของ wrangler)
      - name: Show Cloudflare API errors
        if: failure() && steps.verify.outputs.ok == 'true'
        run: |
          grep -hoE '"(code|message)": ?("[^"]*"|[0-9]+)' ~/.config/.wrangler/logs/*.log | sort | uniq -c | tail -30 || true
